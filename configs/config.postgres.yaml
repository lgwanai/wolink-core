server:
  port: "8080"
  mode: "debug"

database:
  type: "postgres"
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "password"
  dbname: "ai_gateway"
  sslmode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

log:
  level: "info"

security:
  jwt_secret: "your-super-secret-jwt-key"
  sensitive_patterns:
    - '\d{11}'           # 手机号
    - '\d{18}|\d{15}'    # 身份证号
    - '\d{16}'           # 银行卡号
  replacement_patterns:
    - "[PHONE]"
    - "[ID_CARD]"
    - "[BANK_CARD]"

models:
  config_path: "./configs/models"