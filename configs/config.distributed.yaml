# WoLink Core 多节点部署配置示例
# 所有节点使用相同的配置，通过环境变量区分

server:
  port: "8080"
  mode: "release"

# 节点配置 - 每个节点通过环境变量HOSTNAME自动获取唯一ID
node:
  id: "${HOSTNAME}"
  region: "cn-east-1"

# Redis配置 - 所有节点共享
redis:
  host: "redis-cluster.internal"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0

# 日志配置
log:
  level: "info"  # 生产环境建议用 info 或 warn

# 安全配置
security:
  sensitive_patterns:
    - '\d{11}'           # 手机号
    - '\d{18}|\d{15}'    # 身份证号
    - '\d{16}'           # 银行卡号
  replacement_patterns:
    - "[PHONE]"
    - "[ID_CARD]"
    - "[BANK_CARD]"

# 模型配置
models:
  config_path: "./configs/models"

# 通信日志配置 - 支持分布式
communication_log:
  enabled: true
  mode: "local"  # local: 每个节点写本地文件
                 # shared: 使用共享存储（NFS等）
  
  # 本地存储路径
  storage_path: "./logs/communications"
  
  # 启用Redis同步（推荐多节点部署时开启）
  # 开启后，日志会同时写入Redis队列，可被集中收集器消费
  enable_remote_sync: true
  redis_queue_key: "wolink:comm_logs"
  
  # 文件大小和刷新间隔
  max_file_size_mb: 100
  flush_interval_ms: 1000  # 1秒刷新一次

# Admin management API authentication
admin:
  token: "${ADMIN_TOKEN}"  # 从环境变量读取，所有节点使用相同token

# Gateway configuration
gateway:
  mode: "multi"  # 多节点模式：从管理端同步配置

  # 多节点模式：从管理端(master)通过API拉取配置
  admin_master:
    url: "http://admin.internal:8080"  # 管理端地址
    token: "${ADMIN_TOKEN}"            # 管理端鉴权token

  # 配置同步间隔
  sync_interval: "30s"

# 基础设施配置 - 多节点需要调整连接池
infrastructure:
  # 优雅关闭超时
  shutdown_timeout: "30s"

  # HTTP服务器超时
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "120s"
  read_header_timeout: "5s"

  # Redis连接池
  redis_pool:
    pool_size: 50           # 单节点连接池大小
    min_idle_conns: 10      # 单节点最小空闲连接
    conn_max_lifetime: "5m" # 连接最大存活时间
    pool_timeout: "30s"     # 获取连接超时时间

# Gateway operational log
gateway_log:
  mode: "kafka"           # "local" or "kafka"
  storage_path: "./logs/gateway"
  enabled: true
  brokers:
    - "kafka-cluster.internal:9092"
  topic: "gateway-logs"
