server:
  port: "8080"
  mode: "debug"

database:
  type: "mysql"
  host: "localhost"
  port: 3306
  user: "root"
  password: "password"
  dbname: "ai_gateway"
  charset: "utf8mb4"
  parsetime: true
  loc: "Local"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

log:
  level: "info"

security:
  jwt_secret: "your-super-secret-jwt-key"
  sensitive_patterns:
    - '\d{11}'           # 手机号
    - '\d{18}|\d{15}'    # 身份证号
    - '\d{16}'           # 银行卡号
  replacement_patterns:
    - "[PHONE]"
    - "[ID_CARD]"
    - "[BANK_CARD]"

models:
  config_path: "./configs/models"