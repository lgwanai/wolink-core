id: 10001
name: gpt-4
icon_uri: default_icon/openai.png
icon_url: ""
description:
  zh: OpenAI GPT-4 模型
  en: OpenAI GPT-4 model
default_parameters:
  - name: temperature
    label:
      zh: 生成随机性
      en: Temperature
    desc:
      zh: 控制输出的随机性。较高的值会使输出更加随机，较低的值会使输出更加确定。
      en: Controls randomness in the output. Higher values make output more random, lower values make it more deterministic.
    type: float
    min: "0"
    max: "2"
    default_val:
      default_val: "0.7"
    precision: 1
    options: []
    style:
      widget: slider
      label:
        zh: 生成随机性
        en: Temperature
  - name: max_tokens
    label:
      zh: 最大回复长度
      en: Maximum response length
    desc:
      zh: 控制模型输出的最大token数量
      en: Controls the maximum number of tokens in the model output
    type: int
    min: "1"
    max: "4096"
    default_val:
      default_val: "2048"
    options: []
    style:
      widget: slider
      label:
        zh: 输出设置
        en: Output settings
meta:
  protocol: openai
  capability:
    function_call: true
    input_modal:
      - text
      - image
    input_tokens: 8192
    json_mode: true
    max_tokens: 4096
    output_modal:
      - text
    output_tokens: 4096
    prefix_caching: false
    reasoning: true
    prefill_response: false
conn_config:
  base_url: "https://api.openai.com"
  api_key: "YOUR_OPENAI_API_KEY_HERE"  # 请替换为您的实际API密钥
  timeout: 60s
  model: "gpt-4"
  temperature: 0.7
  frequency_penalty: 0
  presence_penalty: 0
  max_tokens: 2048
  top_p: 1
  top_k: 0
  stop: []
  custom: {}
status: 0