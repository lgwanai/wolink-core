server:
  port: "8080"
  mode: "debug"

node:
  id: "node-01"
  region: "cn-east-1"

redis:
  host: "localhost"
  port: 6379
  password: "lingting"
  db: 0

log:
  level: "info"

security:
  sensitive_patterns:
    - '\d{11}'
    - '\d{18}|\d{15}'
    - '\d{16}'
  replacement_patterns:
    - "[PHONE]"
    - "[ID_CARD]"
    - "[BANK_CARD]"

models:
  config_path: "./configs/models"

admin:
  token: "your-admin-token-change-me-in-production"

gateway:
  mode: "single"
  api_keys:
    - key_id: "ak-dev-default"
      key_secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      name: "Default Dev Key"
      daily_limit: 10000
      monthly_limit: 300000
      concurrent_limit: 10