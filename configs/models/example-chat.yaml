# Chat 模型示例
id: example-chat
name: Example Chat Model
type: chat
mode: passthrough
route: fastest
probe:
  enabled: true
  interval: "30s"
  test_prompt: "hello"
icon_uri: default_icon/chat.png
description:
  zh: 对话模型示例
  en: Example Chat Model
default_parameters: []
meta:
  protocol: openai
  capability:
    function_call: true
    input_modal:
      - text
    output_modal:
      - text
conn_config:
  base_url: "http://127.0.0.1:8080"
  api_key: "your-api-key"
  model: "example-chat-model"
status: 1
